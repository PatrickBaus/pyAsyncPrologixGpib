[project]
name = "prologix-gpib-async"
authors = [
  { name="Patrick Baus", email="patrick.baus@physik.tu-darmstadt.de" },
]
description = "A Python AsyncIO library for the Prologix GPIB (Ethernet) adapter"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering",
]
keywords = ["Prologix", "GPIB", "API"]
dynamic = ["version"]
dependencies = [
    "typing-extensions; python_version <'3.11'",
]

[project.urls]
"Homepage" = "https://github.com/PatrickBaus/pyAsyncPrologixGpib"
"Bug Tracker" = "https://github.com/PatrickBaus/pyAsyncPrologixGpib/issues"
"Download" = "https://github.com/PatrickBaus/pyAsyncPrologixGpib/releases"

[project.optional-dependencies]
# Needed to run the scripts in examples/
examples = [
    "asyncio-mqtt", "simplejson",
]
# Needed to run the test suite
test = [
    "pytest",
]
# Linters and type checkers. pylint also checks the examples, so it needs their dependencies.
lint = [
    "prologix-gpib-async[examples]", "black", "isort", "mypy", "pre-commit", "pylint", "types-simplejson",
]
# Building and publishing to PyPI
build = [
    "build", "twine",
]
# Everything needed for development
dev = [
    "prologix-gpib-async[examples,test,lint,build]",
]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.black]
line-length = 120

[build-system]
requires = [
    "setuptools>=61.0",
    "typing-extensions; python_version <'3.11'",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "prologix_gpib_async.__version__"}
