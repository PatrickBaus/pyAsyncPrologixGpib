[project]
name = "prologix-gpib-async"
authors = [
  { name="Patrick Baus", email="patrick.baus@physik.tu-darmstadt.de" },
]
description = "A Python AsyncIO library for the Prologix GPIB (Ethernet) adapter"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering",
]
keywords = ["Prologix", "GPIB", "API"]
dynamic = ["version"]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/PatrickBaus/pyAsyncPrologixGpib"
"Bug Tracker" = "https://github.com/PatrickBaus/pyAsyncPrologixGpib/issues"
"Download" = "https://github.com/PatrickBaus/pyAsyncPrologixGpib/releases"

[project.optional-dependencies]
# Needed to run the scripts in examples/
examples = [
    "asyncio-mqtt", "simplejson",
]
# Needed to run the test suite
test = [
    "pytest",
]
# Linters and type checkers. pylint also checks examples/, tests/ and setup.py, so it needs their dependencies.
lint = [
    "prologix-gpib-async[examples,test]",
    "black", "isort", "mypy", "pre-commit", "pylint", "setuptools", "types-simplejson",
]
# Building and publishing to PyPI
build = [
    "build", "twine",
]
# Everything needed for development
dev = [
    "prologix-gpib-async[examples,test,lint,build]",
]

[tool.pylint.main]
py-version = "3.12"
# Generated by setuptools-scm
ignore = ["_version.py"]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120

[tool.isort]
line_length = 120
profile = "black"
py_version = 312

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
# Require @typing.override on every overriding method, so that renaming a base method cannot silently break a subclass
enable_error_code = ["explicit-override"]

[build-system]
requires = [
    "setuptools>=77.0",  # for the SPDX license expression in [project]
    "setuptools-scm>=8.0",  # for version_file
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# The version is taken from the git tag of the release, e.g. 1.6.0. Commits after a tag get a development version
# like 1.6.1.dev3. The version is written to _version.py during the build. That file is not tracked by git.
version_file = "prologix_gpib_async/_version.py"
# Leave out the "+g<commit hash>" local version part, which PyPI and TestPyPI reject
local_scheme = "no-local-version"
